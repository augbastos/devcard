name: devcard readme

# The card's language bar is one image per language, so each can carry its own
# `title` and a README can name the language under the pointer. The widths and
# that tooltip text are HTML attributes, so they live in the README and cannot
# follow the data on their own — this is what moves them.
#
# Weekly, not daily: every slice's pixels are fetched live on each view, so what
# goes stale between runs is only the proportions and the percentages.
#
# It never pushes to main. main is protected by a ruleset (pull request, squash,
# required checks), and this workflow goes through the same door as a person:
# it regenerates the block and, only if the file changed, opens or updates ONE
# pull request on a fixed branch. That pull request runs CI like any other.
#
# Why a GitHub App token rather than GITHUB_TOKEN: GitHub does not start
# workflows for events caused by GITHUB_TOKEN, so a pull request it opened would
# never get its required checks and could never merge. The App is scoped to this
# repository with contents + pull-requests write, and its token expires with the
# job. Setup: docs/development.md. Until it exists, the job reports whether the
# README is stale in the run summary and changes nothing.
#
# peter-evans/create-pull-request is the widely used, maintained action for
# exactly this — it creates the branch, detects "no change", and updates the
# open pull request instead of stacking new ones. Pinned by SHA like every other
# action here.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcard-readme
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_CLIENT_ID: ${{ vars.DEVCARD_BOT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate the card block
        run: python3 scripts/refresh_readme.py

      - name: Report when no bot is configured
        if: env.APP_CLIENT_ID == ''
        run: |
          if git diff --quiet -- README.md; then
            echo "The README's card block is current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The README's card block is stale. Configure the bot (docs/development.md) or run scripts/refresh_readme.py locally." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint a short-lived App token
        id: app-token
        if: env.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.DEVCARD_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the refresh pull request
        if: env.APP_CLIENT_ID != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: README.md
          branch: bot/refresh-readme-card
          delete-branch: true
          sign-commits: true
          commit-message: "chore(readme): refresh the language bar"
          title: "chore(readme): refresh the language bar"
          body: |
            ## What this changes

            Regenerates the hoverable card block in `README.md` from the live
            Worker (`scripts/refresh_readme.py`): the slice widths and the
            per-language tooltip text. Nothing else.

            ## AI use

            - [ ] I used generative AI
            - [x] I did not use generative AI

            <sub>Opened by `.github/workflows/devcard-readme.yml`.</sub>
