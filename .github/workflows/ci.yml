# CI profile: public
name: CI

# The product's own CI: the Python hook, installer and devcard package, and the
# legacy Worker. Nothing here touches Cloudflare — the Worker suite runs in
# workerd against a local D1 through @cloudflare/vitest-plugin — so no account
# and no secret is involved, and a fork's pull request runs everything like any
# other.
#
# Every `uses:` is pinned to a full commit SHA, with the release it came from in
# a comment. Dependabot (github-actions ecosystem) keeps both current.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2" # weekly security scans

permissions:
  contents: read

# Superseded pull requests stop; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout safety policy from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      # One-time bootstrap: this migration's base has no safety.sh yet.
      # Only then use the PR copy; subsequent PRs always execute the base copy.
      - name: Bootstrap safety policy from the PR
        if: hashFiles('base-policy/.github/scripts/safety.sh') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout PR history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check secrets and critical effects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          PR_DIR: ${{ github.workspace }}/pr
        run: |
          if [ -f base-policy/.github/scripts/safety.sh ]; then
            bash base-policy/.github/scripts/safety.sh
          else
            echo 'One-time bootstrap: safety.sh is absent from the base; running the PR copy.'
            bash bootstrap-policy/.github/scripts/safety.sh
          fi

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not the tip

      - name: Gitleaks
        # The official image, pinned by digest (v8.30.1). No token is handed to
        # it and it needs none.
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          # The checkout belongs to the runner user and the container runs as
          # root, so git would refuse the repository as "dubious ownership".
          # The image's own safe.directory lives in a HOME the runner replaces.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --no-banner --verbose /github/workspace

  dependencies:
    name: Dependency review
    # Dependency review compares pull requests against their base revision.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  hook:
    name: Hooks (${{ matrix.os == 'ubuntu' && 'Ubuntu' || 'Windows' }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}-latest
    # About twice the recent slowest Windows job; Linux finishes much sooner.
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        # The floor install.py enforces (a test keeps the two in step) and the
        # newest release, on Linux and on Windows. Windows is not a courtesy:
        # the capture hook detaches differently there, paths use backslashes and
        # drive letters, and the token file is protected by an ACL instead of
        # mode bits.
        os: [ubuntu, windows]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Identify git to the integration tests
        # The suite builds throwaway repositories and commits into them; git
        # refuses to commit without an identity.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "devcard ci"
          git config --global init.defaultBranch main

      - name: Give Windows an IANA time-zone database
        # Windows ships none, and the golden tests render in Asia/Tokyo.
        # pyproject.toml declares the same dependency for a pipx install.
        if: runner.os == 'Windows'
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Run the hook, installer and devcard package test suites
        # The Python renderer against the golden SVGs, render/publish against
        # temporary local bare repositories, `devcard init`, and a git hook
        # process publishing on its own. No network.
        # Each module gets a process: mocks, temporary repositories/databases
        # and ephemeral HTTP ports stay isolated. No extra matrix jobs.
        run: python scripts/run_tests.py

  python-lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ruff (rules in ruff.toml)
        # pipx ships on the hosted runner; the version is pinned here.
        run: pipx run ruff==0.16.7 check --output-format github .

  package:
    name: Package (pipx)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/requirements-ci.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install from the checkout as a user would from GitHub
        # pipx ships on the hosted runner. `pipx install git+https://...` builds
        # the same wheel from the same pyproject.toml.
        run: pipx install .

      - name: Smoke-test the installed command and hook modules
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          devcard --version
          devcard render --user devcard-ci --out "$RUNNER_TEMP/card"
          grep -q '<svg' "$RUNNER_TEMP/card/card.svg"
          grep -q '<svg' "$RUNNER_TEMP/card/card-dark.svg"
          # The hooks run as `python -S <site-packages>/<hook>.py`: no site
          # import, only the script's own directory on sys.path.
          venv_python="$(pipx environment --value PIPX_LOCAL_VENVS)/devcard/bin/python"
          site_dir="$("$venv_python" -c 'import os, devcard_lib; print(os.path.dirname(devcard_lib.__file__))')"
          "$venv_python" -S -c "import sys; sys.path.insert(0, sys.argv[1]); import devcard_lib, devcard_capture, devcard_sync, devcard_git_hook, install_git_hook, install_claude_hook; from devcard import publish" "$site_dir"

  worker:
    name: Worker (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        # engines.node in worker/package.json (a test keeps the two in step),
        # and the current LTS.
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install the locked toolchain
        # worker/.npmrc sets ignore-scripts, so no dependency's install script runs.
        run: npm ci

      - name: Typecheck the Worker and the tests
        run: npm run typecheck

      - name: Run the Worker test suite
        # Ingest auth, payload validation, body/batch caps, event identity, the
        # cache key, rendering, escaping and the rollup rebuild — against real
        # workerd and a real local D1.
        run: npm test

      - name: Bundle the Worker as a deploy would
        # Catches a Worker that typechecks and passes its tests but that
        # Wrangler cannot bundle from the committed template.
        run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir "$RUNNER_TEMP/bundle"

  ci-passed:
    name: CI passed
    needs: [safety, secrets, dependencies, hook, python-lint, package, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            to_entries | all(.value.result == "success" or
              ((.key == "safety" or .key == "dependencies") and .value.result == "skipped" and $event != "pull_request"))
          ' <<< "$NEEDS_JSON"
