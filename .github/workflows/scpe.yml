name: scpe

# SCPE level 1 — https://github.com/augbastos/scpe
#
# Checks that every pull request carries an AI-use disclosure: an `Assisted-by:` commit
# trailer, or a checked box in the PR template. Nothing is signed, no key is needed, and
# nothing is installed on the runner — the Action runs one stdlib-only Python file out of
# its own checkout.
#
# `require: "true"` computes the gate decision; the last step below fails this job on it, and
# the companion scpe-seal.yml posts the explanation on the pull request.
#
# TWO FILES, NOT ONE. The companion scpe-seal.yml holds the write token and posts the
# comment; this file runs contributor code with no secrets. They cannot be merged: a
# workflow that names itself in `workflow_run.workflows` fails to register with GitHub.
#
# The Action is pinned to the commit of release v0.2.3, not to the tag: a tag can be moved,
# a commit SHA cannot.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scpe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:                       # UNTRUSTED — no secrets; safe to run contributor code
    name: verify                # a required status check: keep the name stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # never write the token into .git/config
          # Level 1 reads the commit messages in the PR range, and level 2 (if this repo
          # ever moves up) recomputes `git diff BASE...HEAD` to check it against the
          # signed digest. Neither is possible with the default shallow checkout.
          fetch-depth: 0

      - id: seal
        uses: augbastos/scpe@b98b50e429a7de2340b78c3c14e5c16dffe6e408 # v0.2.3
        with:
          level: "1"                   # 1 = disclosure lint · 2 = signed envelope required
          require: "true"              # compute gate_pass; enforced by the last step

      # Hand the verdict + PR number to the trusted job. The number MUST travel in the
      # artifact: github.event.workflow_run.pull_requests is empty for fork PRs.
      - name: Record the pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scpe-results
          path: |
            results.json
            pr-number.txt
          retention-days: 7

      # The Action exits 0 at level 1 even when the disclosure is missing, so its
      # results always reach scpe-seal. That leaves `verify` — the check the
      # branch ruleset requires — green either way; this step is what makes it
      # fail. It runs after the upload, so scpe-seal still posts the reason.
      # Dependabot is exempt: nobody wrote its pull requests, and it rewrites
      # their description on every rebase.
      - name: Fail when the disclosure is missing
        if: steps.seal.outputs.gate-pass == 'false' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          echo "::error::No AI-use disclosure. Tick one box in the pull request template, or add an Assisted-by: trailer to a commit."
          exit 1
